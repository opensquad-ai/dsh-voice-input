name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      # OIDC trusted publishing (tokenless auth) requires npm >= 11.5.1.
      # Node 22 ships npm 10.x, which signs provenance but cannot authenticate
      # the publish PUT tokenlessly -> silent 404. Upgrade before publishing.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --provenance --access public